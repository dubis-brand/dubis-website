<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DUBIS Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #e8e0d5;
      min-height: 100vh;
    }

    /* ── Login Screen ── */
    #login-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .admin-logo {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: #c8a96e;
      font-family: Georgia, serif;
      margin-bottom: .5rem;
    }

    .admin-sub {
      color: #555;
      font-size: .75rem;
      letter-spacing: 2px;
      margin-bottom: 2.5rem;
    }

    .login-card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }

    .login-card h2 {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      color: #e8e0d5;
    }

    .form-group { margin-bottom: 1rem; }

    .form-group label {
      display: block;
      font-size: .75rem;
      color: #888;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: .4rem;
    }

    .form-group input {
      width: 100%;
      padding: .7rem 1rem;
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e8e0d5;
      font-size: .9rem;
      outline: none;
      transition: border-color .2s;
    }

    .form-group input:focus { border-color: #c8a96e; }

    .btn-gold {
      width: 100%;
      padding: .85rem;
      background: #c8a96e;
      color: #0d0d0d;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: .9rem;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity .2s;
      margin-top: .5rem;
    }

    .btn-gold:hover { opacity: .85; }
    .btn-gold:disabled { opacity: .5; cursor: not-allowed; }

    .error-msg {
      color: #ef4444;
      font-size: .82rem;
      margin-top: .75rem;
      text-align: center;
    }

    .or-divider {
      display: flex;
      align-items: center;
      gap: .75rem;
      margin: 1.25rem 0 1rem;
      color: #444;
      font-size: .75rem;
      letter-spacing: 1px;
    }
    .or-divider::before, .or-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2a2a;
    }

    .btn-google-admin {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      padding: .75rem 1rem;
      background: #fff;
      border: 1px solid #dadce0;
      border-radius: 6px;
      color: #3c4043;
      font-size: .88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .btn-google-admin:hover { background: #f8f9fa; }

    /* ── Dashboard ── */
    #dashboard { display: none; padding: 0; }

    .topbar {
      background: #111;
      border-bottom: 1px solid #1e1e1e;
      padding: .85rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    /* ── Nav tabs ── */
    .topbar-nav {
      display: flex;
      gap: .25rem;
      flex: 1;
    }

    .nav-tab {
      padding: .4rem 1rem;
      border-radius: 6px;
      font-size: .8rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      background: transparent;
      color: #666;
      transition: all .2s;
      letter-spacing: .5px;
    }

    .nav-tab:hover { color: #e8e0d5; background: #1a1a1a; }
    .nav-tab.active {
      color: #c8a96e;
      background: rgba(200,169,110,.1);
      border-color: rgba(200,169,110,.25);
    }

    .topbar-logo {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 4px;
      color: #c8a96e;
      font-family: Georgia, serif;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .topbar-email { color: #555; font-size: .8rem; }

    .btn-sm {
      padding: .4rem .9rem;
      border-radius: 5px;
      font-size: .75rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid #333;
      background: transparent;
      color: #888;
      transition: color .2s, border-color .2s;
    }

    .btn-sm:hover { color: #e8e0d5; border-color: #555; }

    .main-content { padding: 2rem 1.5rem; max-width: 1200px; margin: 0 auto; }

    /* ── Stats ── */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: #1a1a1a;
      border-radius: 10px;
      padding: 1.25rem 1.5rem;
    }

    .stat-label {
      font-size: .7rem;
      color: #555;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: .4rem;
    }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 700;
      color: #c8a96e;
    }

    .stat-sub { font-size: .78rem; color: #666; margin-top: .2rem; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: .75rem;
      margin-bottom: 1.25rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .filter-btn {
      padding: .35rem .9rem;
      border-radius: 20px;
      font-size: .78rem;
      cursor: pointer;
      border: 1px solid #2a2a2a;
      background: transparent;
      color: #666;
      transition: all .2s;
    }

    .filter-btn:hover, .filter-btn.active {
      border-color: #c8a96e;
      color: #c8a96e;
      background: rgba(200,169,110,.08);
    }

    .search-input {
      padding: .4rem .9rem;
      border-radius: 6px;
      border: 1px solid #2a2a2a;
      background: #111;
      color: #e8e0d5;
      font-size: .82rem;
      outline: none;
      margin-left: auto;
      width: 220px;
    }

    .search-input:focus { border-color: #c8a96e; }

    /* ── Orders Table ── */
    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .83rem;
    }

    th {
      text-align: left;
      padding: .6rem 1rem;
      color: #555;
      font-size: .68rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-bottom: 1px solid #1e1e1e;
      white-space: nowrap;
    }

    td {
      padding: .85rem 1rem;
      border-bottom: 1px solid #141414;
      vertical-align: middle;
    }

    tr:hover td { background: rgba(255,255,255,.02); }

    .status-badge {
      display: inline-block;
      padding: .25rem .65rem;
      border-radius: 20px;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .5px;
    }

    .status-pending      { background: rgba(245,158,11,.15); color: #f59e0b; }
    .status-in_production{ background: rgba(59,130,246,.15);  color: #3b82f6; }
    .status-shipped      { background: rgba(139,92,246,.15);  color: #8b5cf6; }
    .status-delivered    { background: rgba(34,197,94,.15);   color: #22c55e; }
    .status-cancelled    { background: rgba(239,68,68,.15);   color: #ef4444; }

    .order-id { font-family: monospace; color: #888; font-size: .78rem; }
    .amount   { color: #c8a96e; font-weight: 600; }

    .track-link {
      color: #c8a96e;
      text-decoration: none;
      font-size: .75rem;
    }

    .track-link:hover { text-decoration: underline; }

    .items-summary { color: #888; font-size: .78rem; max-width: 200px; }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #444;
    }

    .empty {
      text-align: center;
      padding: 3rem;
      color: #444;
    }

    /* ── Users Table ── */
    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #c8a96e, #8b6914);
      color: #0d0d0d;
      font-weight: 700;
      font-size: .8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .user-cell {
      display: flex;
      align-items: center;
      gap: .65rem;
    }

    .user-name {
      font-size: .85rem;
      color: #e8e0d5;
      line-height: 1.2;
    }

    .user-email-sub {
      font-size: .72rem;
      color: #555;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: .25rem;
      padding: .18rem .55rem;
      border-radius: 20px;
      font-size: .65rem;
      font-weight: 700;
      letter-spacing: .5px;
      text-transform: uppercase;
    }

    .badge-super { background: rgba(200,169,110,.2); color: #c8a96e; border: 1px solid rgba(200,169,110,.3); }
    .badge-admin { background: rgba(59,130,246,.15); color: #60a5fa; border: 1px solid rgba(59,130,246,.25); }
    .badge-user  { background: rgba(255,255,255,.05); color: #555; border: 1px solid #1e1e1e; }

    .provider-badge {
      display: inline-flex;
      align-items: center;
      gap: .3rem;
      font-size: .72rem;
      color: #666;
    }

    .btn-toggle-admin {
      padding: .3rem .75rem;
      border-radius: 5px;
      font-size: .72rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid;
      transition: all .2s;
      white-space: nowrap;
    }

    .btn-grant  { border-color: rgba(59,130,246,.4); color: #60a5fa; background: rgba(59,130,246,.08); }
    .btn-grant:hover  { background: rgba(59,130,246,.2); }
    .btn-revoke { border-color: rgba(239,68,68,.4);  color: #f87171; background: rgba(239,68,68,.08); }
    .btn-revoke:hover { background: rgba(239,68,68,.2); }
    .btn-toggle-admin:disabled { opacity: .4; cursor: not-allowed; }

    .users-count { color: #555; font-size: .8rem; margin-left: auto; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .main-content { padding: 1rem; }
      .search-input { width: 100%; margin-left: 0; }
      td.hide-mobile, th.hide-mobile { display: none; }
      .topbar-nav { gap: 0; }
      .nav-tab { padding: .4rem .6rem; font-size: .72rem; }
    }
  </style>
</head>
<body>

<!-- ══ LOGIN SCREEN ══════════════════════════════════════════ -->
<div id="login-screen">
  <div class="admin-logo">DUBIS</div>
  <div class="admin-sub">ADMIN PORTAL</div>
  <div class="login-card">
    <h2>Sign in to continue</h2>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="admin-email" placeholder="admin@dubis.net" autocomplete="email">
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="admin-password" placeholder="••••••••" autocomplete="current-password"
             onkeydown="if(event.key==='Enter') adminLogin()">
    </div>
    <button class="btn-gold" id="btn-login" onclick="adminLogin()">Sign In</button>
    <div class="error-msg" id="login-error"></div>

    <div class="or-divider">or</div>
    <button class="btn-google-admin" onclick="adminSignInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
      Continue with Google
    </button>
  </div>
</div>

<!-- ══ DASHBOARD ════════════════════════════════════════════ -->
<div id="dashboard">
  <div class="topbar">
    <div class="topbar-logo">DUBIS</div>
    <nav class="topbar-nav">
      <button class="nav-tab active" id="nav-orders" onclick="showSection('orders',this)">📋 Orders</button>
      <button class="nav-tab" id="nav-users"  onclick="showSection('users',this)">👥 Users</button>
    </nav>
    <div class="topbar-right">
      <span class="topbar-email" id="admin-user-email"></span>
      <button class="btn-sm" onclick="adminLogout()">Sign out</button>
    </div>
  </div>

  <div class="main-content">

  <!-- ══ ORDERS SECTION ══════════════════════════════════ -->
  <div id="section-orders">
    <div class="stats-grid" id="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value" id="stat-revenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Today's Revenue</div>
        <div class="stat-value" id="stat-today">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Shipped</div>
        <div class="stat-value" id="stat-shipped">—</div>
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-filter="all"    onclick="setFilter('all',this)">All</button>
      <button class="filter-btn" data-filter="pending"       onclick="setFilter('pending',this)">Pending</button>
      <button class="filter-btn" data-filter="in_production" onclick="setFilter('in_production',this)">In Production</button>
      <button class="filter-btn" data-filter="shipped"       onclick="setFilter('shipped',this)">Shipped</button>
      <button class="filter-btn" data-filter="delivered"     onclick="setFilter('delivered',this)">Delivered</button>
      <button class="filter-btn" data-filter="cancelled"     onclick="setFilter('cancelled',this)">Cancelled</button>
      <input class="search-input" type="text" id="search-input"
             placeholder="Search email or order ID…" oninput="renderTable()">
    </div>

    <div class="table-wrap">
      <div class="loading" id="table-loading">Loading orders… 🐾</div>
      <table id="orders-table" style="display:none">
        <thead>
          <tr>
            <th>Date</th>
            <th>Order ID</th>
            <th class="hide-mobile">Email</th>
            <th>Items</th>
            <th>Status</th>
            <th>Amount</th>
            <th class="hide-mobile">Tracking</th>
          </tr>
        </thead>
        <tbody id="orders-tbody"></tbody>
      </table>
      <div class="empty" id="table-empty" style="display:none">No orders found.</div>
    </div>
  </div><!-- /section-orders -->

  <!-- ══ USERS SECTION ═══════════════════════════════════ -->
  <div id="section-users" style="display:none">
    <div class="filters">
      <input class="search-input" type="text" id="user-search"
             placeholder="Search by name or email…" oninput="renderUsers()"
             style="margin-left:0;width:260px">
      <span class="users-count" id="users-count"></span>
    </div>
    <div class="table-wrap">
      <div class="loading" id="users-loading">Loading users… 🐾</div>
      <table id="users-table" style="display:none">
        <thead>
          <tr>
            <th>User</th>
            <th class="hide-mobile">Joined</th>
            <th class="hide-mobile">Last Sign-in</th>
            <th>Provider</th>
            <th>Role</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="users-tbody"></tbody>
      </table>
      <div class="empty" id="users-empty" style="display:none">No users found.</div>
    </div>
  </div><!-- /section-users -->

  </div><!-- /main-content -->
</div><!-- /dashboard -->

<script>
  const SUPABASE_URL  = 'https://ntzwvqtpdmvvavbhuyeb.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im50end2cXRwZG12dmF2Ymh1eWViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2ODk1ODAsImV4cCI6MjA4NzI2NTU4MH0.EpfZAg28aU6_sOblfkVpkAwp9nDvXMTRCCNz0UJWHEc';

  let _sb        = null;
  let _allUsers  = [];
  let _allOrders = [];
  let _currentFilter = 'all';

  // ── Init ──────────────────────────────────────────────────
  window.addEventListener('DOMContentLoaded', async () => {
    _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { persistSession: true, storageKey: 'dubis-auth' }
    });

    const { data: { session } } = await _sb.auth.getSession();
    if (session?.user) {
      await showDashboard(session.user, session.access_token);
    }

    // Handle OAuth redirect callback (Google login lands back here)
    _sb.auth.onAuthStateChange(async (event, session) => {
      if (event === 'SIGNED_IN' && session?.user) {
        await showDashboard(session.user, session.access_token);
      }
    });
  });

  // ── Login ─────────────────────────────────────────────────
  async function adminLogin() {
    const email    = document.getElementById('admin-email').value.trim();
    const password = document.getElementById('admin-password').value;
    const errEl    = document.getElementById('login-error');
    const btn      = document.getElementById('btn-login');

    errEl.textContent = '';
    if (!email || !password) { errEl.textContent = 'Enter email and password.'; return; }

    btn.disabled = true;
    btn.textContent = 'Signing in…';

    const { data, error } = await _sb.auth.signInWithPassword({ email, password });
    btn.disabled = false;
    btn.textContent = 'Sign In';

    if (error) { errEl.textContent = error.message; return; }
    await showDashboard(data.user, data.session.access_token);
  }

  // ── Google Sign-In ────────────────────────────────────────
  async function adminSignInWithGoogle() {
    const { error } = await _sb.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: 'https://www.dubis.net/admin' }
    });
    if (error) {
      document.getElementById('login-error').textContent = error.message;
    }
  }

  // ── Dashboard ─────────────────────────────────────────────
  async function showDashboard(user, token) {
    document.getElementById('admin-user-email').textContent = user.email;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    await loadOrders(token);
  }

  async function loadOrders(token) {
    // Use the token from the current session if not passed
    if (!token) {
      const { data: { session } } = await _sb.auth.getSession();
      token = session?.access_token;
    }

    try {
      const res = await fetch('/api/admin/orders', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 403) {
        document.getElementById('table-loading').textContent =
          '⛔ Access denied. Your email is not in the admin list.';
        return;
      }

      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const json = await res.json();
      _allOrders = json.orders || [];

      // Stats
      document.getElementById('stat-total').textContent   = json.stats.total;
      document.getElementById('stat-revenue').textContent = `$${json.stats.totalRevenue}`;
      document.getElementById('stat-today').textContent   = `$${json.stats.todayRevenue}`;
      document.getElementById('stat-pending').textContent = json.stats.statusCounts.pending || 0;
      document.getElementById('stat-shipped').textContent = json.stats.statusCounts.shipped || 0;

      document.getElementById('table-loading').style.display = 'none';
      renderTable();

    } catch(err) {
      document.getElementById('table-loading').textContent = 'Error loading orders: ' + err.message;
    }
  }

  // ── Filter & Render ───────────────────────────────────────
  function setFilter(filter, btn) {
    _currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTable();
  }

  function renderTable() {
    const search  = (document.getElementById('search-input').value || '').toLowerCase();
    const tbody   = document.getElementById('orders-tbody');
    const table   = document.getElementById('orders-table');
    const empty   = document.getElementById('table-empty');

    let rows = _allOrders.filter(o => {
      if (_currentFilter !== 'all' && o.status !== _currentFilter) return false;
      if (search) {
        const hay = `${o.buyer_email || ''} ${o.paypal_order_id || ''} ${o.id || ''}`.toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });

    if (rows.length === 0) {
      table.style.display = 'none';
      empty.style.display = 'block';
      return;
    }

    table.style.display = 'table';
    empty.style.display = 'none';

    tbody.innerHTML = rows.map(o => {
      const date  = new Date(o.created_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
      const shortId = (o.paypal_order_id || o.id || '').toString().substring(0, 12).toUpperCase();
      const items = (Array.isArray(o.items) ? o.items : [])
        .map(i => `${i.typeLabel || i.type} ${i.selectedSize}/${i.selectedColor}`)
        .join(', ');
      const statusClass = `status-${o.status || 'pending'}`;
      const statusLabel = (o.status || 'pending').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
      const tracking = o.tracking_number
        ? `<a class="track-link" href="${o.tracking_url || `https://track.aftership.com/${o.tracking_number}`}" target="_blank">${o.tracking_number}</a>`
        : '<span style="color:#333">—</span>';

      return `
        <tr>
          <td>${date}</td>
          <td><span class="order-id">${shortId}</span></td>
          <td class="hide-mobile" style="color:#888;font-size:.8rem">${o.buyer_email || '—'}</td>
          <td><div class="items-summary">${items || '—'}</div></td>
          <td><span class="status-badge ${statusClass}">${statusLabel}</span></td>
          <td class="amount">$${Number(o.total_amount || 0).toFixed(2)}</td>
          <td class="hide-mobile">${tracking}</td>
        </tr>`;
    }).join('');
  }

  // ── Section navigation ────────────────────────────────
  let _usersLoaded = false;

  function showSection(name, btn) {
    document.getElementById('section-orders').style.display = name === 'orders' ? '' : 'none';
    document.getElementById('section-users').style.display  = name === 'users'  ? '' : 'none';
    document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (name === 'users' && !_usersLoaded) {
      _usersLoaded = true;
      loadUsers();
    }
  }

  // ── Users: Load ───────────────────────────────────────
  async function loadUsers() {
    const { data: { session } } = await _sb.auth.getSession();
    const token = session?.access_token;
    if (!token) return;

    document.getElementById('users-loading').style.display = '';
    document.getElementById('users-table').style.display   = 'none';
    document.getElementById('users-empty').style.display   = 'none';

    try {
      const res = await fetch('/api/admin/users', {
        headers: { 'Authorization': `Bearer ${token}` }
      });

      if (res.status === 403) {
        document.getElementById('users-loading').textContent = '⛔ Access denied.';
        return;
      }
      if (!res.ok) throw new Error(`HTTP ${res.status}`);

      const json = await res.json();
      _allUsers = json.users || [];
      document.getElementById('users-loading').style.display = 'none';
      renderUsers();

    } catch(err) {
      document.getElementById('users-loading').textContent = 'Error: ' + err.message;
    }
  }

  // ── Users: Render ─────────────────────────────────────
  function renderUsers() {
    const search  = (document.getElementById('user-search').value || '').toLowerCase();
    const tbody   = document.getElementById('users-tbody');
    const table   = document.getElementById('users-table');
    const empty   = document.getElementById('users-empty');
    const counter = document.getElementById('users-count');

    const rows = _allUsers.filter(u => {
      if (!search) return true;
      return (u.email + ' ' + (u.full_name || '')).toLowerCase().includes(search);
    });

    counter.textContent = `${rows.length} user${rows.length !== 1 ? 's' : ''}`;

    if (rows.length === 0) {
      table.style.display = 'none';
      empty.style.display = '';
      return;
    }

    table.style.display = '';
    empty.style.display = 'none';

    tbody.innerHTML = rows.map(u => {
      const initials = ((u.full_name || u.email || '?').charAt(0)).toUpperCase();
      const name     = u.full_name || '';
      const joined   = u.created_at
        ? new Date(u.created_at).toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' })
        : '—';
      const lastSeen = u.last_sign_in_at
        ? new Date(u.last_sign_in_at).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' })
        : 'Never';

      const providerIcon  = u.provider === 'google' ? '🔵' : u.provider === 'azure' ? '🟦' : '📧';
      const providerLabel = { google: 'Google', azure: 'Microsoft', email: 'Email' }[u.provider] || u.provider;

      let roleBadge, actionBtn;
      if (u.is_super_admin) {
        roleBadge = `<span class="admin-badge badge-super">⭐ Super Admin</span>`;
        actionBtn = `<span style="color:#333;font-size:.75rem">Protected</span>`;
      } else if (u.is_admin) {
        roleBadge = `<span class="admin-badge badge-admin">🛡 Admin</span>`;
        actionBtn = `<button class="btn-toggle-admin btn-revoke"
                       onclick="toggleAdmin('${u.email}', false, this)">Revoke Admin</button>`;
      } else {
        roleBadge = `<span class="admin-badge badge-user">User</span>`;
        actionBtn = `<button class="btn-toggle-admin btn-grant"
                       onclick="toggleAdmin('${u.email}', true, this)">Make Admin</button>`;
      }

      return `
        <tr>
          <td>
            <div class="user-cell">
              <div class="user-avatar">${initials}</div>
              <div>
                <div class="user-name">${name || '<span style="color:#444">—</span>'}</div>
                <div class="user-email-sub">${u.email}</div>
              </div>
            </div>
          </td>
          <td class="hide-mobile" style="color:#666;font-size:.8rem">${joined}</td>
          <td class="hide-mobile" style="color:#666;font-size:.8rem">${lastSeen}</td>
          <td><span class="provider-badge">${providerIcon} ${providerLabel}</span></td>
          <td>${roleBadge}</td>
          <td>${actionBtn}</td>
        </tr>`;
    }).join('');
  }

  // ── Users: Toggle admin ───────────────────────────────
  async function toggleAdmin(email, grant, btn) {
    btn.disabled = true;
    btn.textContent = grant ? 'Granting…' : 'Revoking…';

    const { data: { session } } = await _sb.auth.getSession();
    const token = session?.access_token;

    try {
      const res = await fetch('/api/admin/users', {
        method:  'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type':  'application/json',
        },
        body: JSON.stringify({ action: grant ? 'grant' : 'revoke', email }),
      });

      const json = await res.json();
      if (!res.ok) {
        alert('Error: ' + (json.error || 'Unknown error'));
        btn.disabled = false;
        btn.textContent = grant ? 'Make Admin' : 'Revoke Admin';
        return;
      }

      // Update local data and re-render without full reload
      _allUsers = _allUsers.map(u => u.email === email ? { ...u, is_admin: grant } : u);
      renderUsers();

    } catch(err) {
      alert('Network error: ' + err.message);
      btn.disabled = false;
    }
  }

  // ── Logout ────────────────────────────────────────────────
  async function adminLogout() {
    await _sb.auth.signOut();
    location.reload();
  }
</script>
</body>
