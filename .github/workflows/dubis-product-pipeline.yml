name: DUBIS Autonomous Product Pipeline

# Triggered by Edge Function (?type=approve-product) via repository_dispatch
# when oren approves a slogan candidate. Runs the Gelato-real-image pipeline:
# print files → Gelato draft → download REAL Gelato mockup previews →
# commit them as the site's product mockups → callback Edge Function.
#
# Per oren directive 2026-05-16:
#   "התמונות חייבות להיות מבוססות על תמונות אמיתיות של האתר GELATO"
# Site mockups MUST come from Gelato's draft-order preview images,
# NOT from local node-canvas composite. The previous composite-based flow
# (generate-blanks + composite-mockups + verify-parity) was retired in this
# rewrite because Gemini-generated blanks + canvas-composited text never
# match what Gelato actually prints.

on:
  repository_dispatch:
    types: [boss-approved-product]
  workflow_dispatch:
    inputs:
      product_id:
        description: 'dubis_products.id (uuid) — approved product to publish'
        required: true
      product_id_numeric:
        description: 'product_id_numeric (e.g. 19) — used in filenames'
        required: true

permissions:
  contents: write   # commits designs/ + images/ + js/products.js
  id-token: write

jobs:
  publish-product:
    name: Build print files + Gelato draft + real mockups for one product
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      PRODUCT_UUID:    ${{ github.event.client_payload.product_id || github.event.inputs.product_id }}
      PRODUCT_NUMERIC: ${{ github.event.client_payload.product_id_numeric || github.event.inputs.product_id_numeric }}

    steps:
      - name: Checkout main with PAT (for push back)
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dubis-website/package-lock.json

      - name: System deps — node-canvas + Anton font (Impact-equivalent)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2-dev libpango1.0-dev libjpeg-dev \
            libgif-dev librsvg2-dev build-essential pkg-config python3
          mkdir -p $HOME/.fonts
          curl -sSL -o $HOME/.fonts/Anton-Regular.ttf \
            "https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf"
          fc-cache -f
          fc-list | grep -i anton || (echo "Anton font failed to install" && exit 1)

      - name: Install npm deps
        working-directory: dubis-website
        run: npm ci --no-audit --no-fund

      - name: Show context
        run: |
          echo "PRODUCT_UUID:    $PRODUCT_UUID"
          echo "PRODUCT_NUMERIC: $PRODUCT_NUMERIC"
          if [ -z "$PRODUCT_UUID" ] || [ -z "$PRODUCT_NUMERIC" ]; then
            echo "ERROR: PRODUCT_UUID and PRODUCT_NUMERIC are required."
            exit 1
          fi

      # ──────────────────────────────────────────────────────────
      # STEP 1 — Generate print files (3600×4200 PNGs)
      # These are the actual files Gelato will print on the garment back +
      # the universal DUBIS™ chest logo. They live at /designs/ and Gelato
      # fetches them via DESIGN_BASE_URL when rendering the draft mockup.
      # ──────────────────────────────────────────────────────────
      - name: 1️⃣ Generate print files (3600×4200 PNGs for Gelato)
        working-directory: dubis-website
        env:
          DUBIS_FONT_PATH: /home/runner/.fonts/Anton-Regular.ttf
          DUBIS_FONT_FAMILY: Anton
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/generate-designs.js --product-numeric=$PRODUCT_NUMERIC

      # ──────────────────────────────────────────────────────────
      # STEP 2 — Commit print files before Gelato draft.
      # Gelato fetches design files from public URL (dubis.net/designs/...).
      # Vercel auto-deploys on push, so we must push the print files BEFORE
      # creating the Gelato draft or Gelato will get 404.
      # ──────────────────────────────────────────────────────────
      - name: 2️⃣ Commit + push print files (pre-Gelato)
        working-directory: dubis-website
        run: |
          git config user.name  "dubis-pipeline-bot"
          git config user.email "dubis-pipeline-bot@users.noreply.github.com"
          git add designs/
          if git diff --cached --quiet; then
            echo "No new print files. Skipping commit."
          else
            git commit -m "feat(designs): print files for product $PRODUCT_NUMERIC (auto-pipeline)"
            git push origin main
          fi

      - name: 2️⃣b Wait 60s for Vercel deploy to serve new design files
        run: |
          echo "Waiting for Vercel auto-deploy so Gelato sees the new design files..."
          sleep 60

      # ──────────────────────────────────────────────────────────
      # STEP 3 — Create Gelato draft + download REAL preview images
      # The script (in --save-as-site-images mode) writes Gelato's rendered
      # mockups directly to dubis-website/images/product-{N}-{Color}-{front|back}.png.
      # These ARE the site mockups — no node-canvas composite anywhere.
      # ──────────────────────────────────────────────────────────
      - name: 3️⃣ Create Gelato draft + download real Gelato mockups → images/
        id: gelato_draft
        working-directory: dubis-website
        env:
          GELATO_API_KEY: ${{ secrets.GELATO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -o pipefail
          OUT=$(node scripts/create-gelato-drafts.js --product=$PRODUCT_NUMERIC --save-as-site-images --json | tee /tmp/draft.log)
          # Extract the JSON manifest block between ===JSON_MANIFEST=== markers
          awk '/===JSON_MANIFEST===/{flag=1;next}/===END_JSON_MANIFEST===/{flag=0}flag' /tmp/draft.log > /tmp/manifest.json
          cat /tmp/manifest.json
          DRAFT_ID=$(node -e "const m=require('/tmp/manifest.json');console.log(m.orderId||'')")
          PREVIEWS_JSON=$(node -e "const m=require('/tmp/manifest.json');console.log(JSON.stringify(m.previews||{}))")
          echo "draft_id=$DRAFT_ID"        >> $GITHUB_OUTPUT
          # Use heredoc for multi-line output (URLs contain &)
          {
            echo "previews_json<<__END__"
            echo "$PREVIEWS_JSON"
            echo "__END__"
          } >> $GITHUB_OUTPUT

      # ──────────────────────────────────────────────────────────
      # STEP 4 — Regenerate js/products.js from DB
      # ──────────────────────────────────────────────────────────
      - name: 4️⃣ Regenerate js/products.js from DB
        working-directory: dubis-website
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/sync-products-to-js.js --write

      # ──────────────────────────────────────────────────────────
      # STEP 5 — Commit Gelato mockups + products.js
      # ──────────────────────────────────────────────────────────
      - name: 5️⃣ Commit + push Gelato mockups + products.js
        working-directory: dubis-website
        run: |
          git add images/ js/products.js
          if git diff --cached --quiet; then
            echo "No image changes."
          else
            git commit -m "feat(product): Gelato real mockups for product $PRODUCT_NUMERIC — draft ${{ steps.gelato_draft.outputs.draft_id }}"
            git push origin main
          fi

      # ──────────────────────────────────────────────────────────
      # STEP 6 — Callback Edge Function with status=live + previews
      # ──────────────────────────────────────────────────────────
      - name: 6️⃣ Callback Edge Function — mark product live
        env:
          EDGE_URL: ${{ secrets.SUPABASE_URL }}/functions/v1/agents
          AGENT_SECRET: ${{ secrets.DUBIS_AGENT_SECRET }}
          DRAFT_ID: ${{ steps.gelato_draft.outputs.draft_id }}
          PREVIEWS_JSON: ${{ steps.gelato_draft.outputs.previews_json }}
        run: |
          # Build the callback payload safely via Node (avoids shell-quoting hell on URLs with &)
          PAYLOAD=$(node -e "
            const p = {
              product_id: process.env.PRODUCT_UUID,
              product_id_numeric: Number(process.env.PRODUCT_NUMERIC),
              status: 'live',
              gelato_draft_id: process.env.DRAFT_ID || null,
              gelato_preview_urls: JSON.parse(process.env.PREVIEWS_JSON || '{}'),
              workflow_run_id: '${{ github.run_id }}'
            };
            process.stdout.write(JSON.stringify(p));
          ")
          curl -fsS -X POST "$EDGE_URL?type=gha-pipeline-callback" \
            -H "x-agent-secret: $AGENT_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

      - name: ❌ On failure — callback with status=failed
        if: failure()
        env:
          EDGE_URL: ${{ secrets.SUPABASE_URL }}/functions/v1/agents
          AGENT_SECRET: ${{ secrets.DUBIS_AGENT_SECRET }}
        run: |
          PAYLOAD=$(node -e "
            const p = {
              product_id: process.env.PRODUCT_UUID,
              product_id_numeric: Number(process.env.PRODUCT_NUMERIC),
              status: 'failed',
              workflow_run_id: '${{ github.run_id }}',
              error: 'GHA workflow failed — check run logs'
            };
            process.stdout.write(JSON.stringify(p));
          ")
          curl -fsS -X POST "$EDGE_URL?type=gha-pipeline-callback" \
            -H "x-agent-secret: $AGENT_SECRET" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || true
