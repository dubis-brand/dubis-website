name: DUBIS TikTok Daily

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      product_id:
        description: 'product_id_numeric (optional, picks random active if blank)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  render-publish:
    name: Render TikTok video and publish via Late
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install ffmpeg + fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-liberation

      - name: Install npm deps
        working-directory: video
        run: |
          npm install --no-audit --no-fund @supabase/supabase-js@2

      - name: Render and publish
        working-directory: video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUBIS_AGENT_SECRET: ${{ secrets.DUBIS_AGENT_SECRET }}
          INPUT_PRODUCT_ID: ${{ github.event.inputs.product_id }}
        run: node scripts/render-and-publish.js

      - name: Upload rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-video-${{ github.run_id }}
          path: video/out/*.mp4
          if-no-files-found: ignore
          retention-days: 7
