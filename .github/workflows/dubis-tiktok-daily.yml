name: DUBIS TikTok Daily

# Replaces the static slideshow flow (render-and-publish.js) — 2026-05-23 per oren feedback.
# Picks one reel from the bilingual persona bank (Supabase Storage video-assets/_pilot/*.mp4)
# by deterministic day-of-year rotation, posts to TikTok via Late.com.
# See memory/tiktok-strategy.md for the rotation rule + bank structure.

on:
  schedule:
    # 15:00 UTC = 18:00 Israel during IDT (summer). Adjust to '0 16 * * *' for IST (winter).
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force_persona:
        description: 'Force a specific persona id (e.g. men-1) — leave blank for rotation pick'
        required: false
        default: ''
      force_lang:
        description: 'Force HE or EN — leave blank for rotation pick'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: Pick reel from bank and publish via Late.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm deps
        run: npm install --no-audit --no-fund @supabase/supabase-js@2

      - name: Publish daily reel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUBIS_LATE_API_KEY: ${{ secrets.DUBIS_LATE_API_KEY }}
          DUBIS_LATE_TIKTOK_ACCOUNT: ${{ secrets.DUBIS_LATE_TIKTOK_ACCOUNT }}
          FORCE_PERSONA: ${{ github.event.inputs.force_persona }}
          FORCE_LANG: ${{ github.event.inputs.force_lang }}
        run: node scripts/tiktok-from-reel-bank.mjs
