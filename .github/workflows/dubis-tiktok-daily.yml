name: DUBIS TikTok Daily

# Replaces the static slideshow flow (render-and-publish.js) — 2026-05-23 per oren feedback.
# Rewritten 2026-06-28: picks ONE unique product reel from the product-keyed bank
# (Supabase Storage video-assets/_pilot/product-{pid}-FINAL-EN.mp4) by least-recently-posted
# rotation, Hebrew caption (IL-only), posts to TikTok via Late.com. No HE/EN duplication.
# See memory/tiktok-strategy.md for the rotation rule + bank structure.

on:
  schedule:
    # 15:00 UTC = 18:00 Israel during IDT (summer). Adjust to '0 16 * * *' for IST (winter).
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force_product:
        description: 'Force a specific product id (e.g. 34) — leave blank for least-recently-posted pick'
        required: false
        default: ''
      dry_run:
        description: 'Set to 1 to resolve + log the pick without publishing'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    name: Pick reel from bank and publish via Late.com
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm deps
        run: npm install --no-audit --no-fund @supabase/supabase-js@2

      - name: Publish daily reel
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DUBIS_LATE_API_KEY: ${{ secrets.DUBIS_LATE_API_KEY }}
          DUBIS_LATE_TIKTOK_ACCOUNT: ${{ secrets.DUBIS_LATE_TIKTOK_ACCOUNT }}
          FORCE_PRODUCT: ${{ github.event.inputs.force_product }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/tiktok-from-reel-bank.mjs
